# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/movieapp?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=alex@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Server Configuration
server.port=8080

# JWT Configuration
# WARNING: Change this secret key in production to a strong, secure random value
# Use at least 256 bits (32 characters) for HS512 algorithm
app.jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationPurposesOnlyChangeInProduction
# Token expiration time in milliseconds (default: 24 hours = 86400000 ms)
app.jwt.expiration=86400000

# OMDb API Configuration
omdb.api.url=https://www.omdbapi.com/
omdb.api.key=966c4f4f

# CORS Configuration
cors.allowed.origins=http://localhost:5173
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.allow.credentials=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.movie_app_backend=DEBUG
logging.level.org.springframework.security=DEBUG

# Application Configuration
spring.application.name=Movie App Backend
spring.application.name=Movie App Backend

